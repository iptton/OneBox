# Dependabot 配置
# 合并前请先读 CONTRIBUTING.md 的 "What we do not merge" 一节:
# 依赖升级必须本地构建过才允许合并, bot 开的 PR 也不例外。

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      # 原来是 daily: 一周内堆出 5 个 PR, 单个 PR 又没人构建验证过, 全卡住了。
      # 改成每周一次 + 分组, 一个 PR 里放完当周所有 minor/patch 升级。
      interval: "weekly"
      day: "monday"
      time: "22:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # OpenCV 5.x 是破坏性大版本: 需要同步迁移 libs/opencv-tools 与 NDK 原生构建,
      # 不能由 bot 的 PR 决定。要升级请单独开 issue 讨论。
      - dependency-name: "org.opencv:opencv"
        update-types: ["version-update:semver-major"]
      # material-kolor 5.x 改了主题 API 面。
      - dependency-name: "com.materialkolor:material-kolor"
        update-types: ["version-update:semver-major"]
      # pdfviewer 1.0.0-beta01 起依赖 androidx.pdf:pdf-core:1.0.0-beta01, 后者声明
      # minSdk 28, 而本项目是 minSdk 24 —— 合进去会让 Android 8.x 及以下直接装不上。
      # 要升就得先决定砍不砍 minSdk, 那是产品决策, 不是一次依赖升级。
      # PR #15 的 CI 日志(processFossUniversalDebugMainManifest)是证据。
      - dependency-name: "pdfviewer"
        versions: [">= 1.0.0-beta01"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "22:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
    # 不分组的话每个 action 各开一个 PR, 一次能开三个。
    groups:
      github-actions:
        patterns: ["*"]
